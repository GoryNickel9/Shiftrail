nd:var(--bg);border:4px solid #32434a;border-radius:18px;padding:14px 9px}.mini b{font-size:12px}.mini .block{background:var(--blue);height:55px;border-radius:8px;margin:10px 0}.mini .line{height:10px;background:#e0e6e6;margin:7px 0;border-radius:3px}.previewlabel{text-align:center;font-size:11px;color:var(--muted)}.fields{display:flex;gap:12px;margin-top:22px}.field{flex:1;background:white;border:1px solid #a4b6d6;border-radius:12px;padding:12px 14px;display:block;text-align:left}.field span{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.field b{font-size:22px;color:var(--blue);font-weight:650}.sheetback{position:absolute;inset:0;background:#162a3566;z-index:2}.sheet{position:absolute;z-index:3;bottom:0;left:0;right:0;background:var(--bg);border-radius:26px 26px 0 0;padding:12px 20px 30px}.handle{width:36px;height:4px;background:#b8c4c7;border-radius:4px;margin:0 auto 22px}.sheet h2{font-size:22px}.sheet .sub{font-size:12px}.wheelhead{display:flex;text-align:center;margin-top:22px;color:var(--muted);font-size:12px}.wheelhead span{flex:1}.wheels{display:flex;position:relative;justify-content:center;align-items:center;gap:15px;margin:8px 10px 22px}.wheels:before{content:'';position:absolute;left:0;right:0;top:84px;height:42px;background:var(--pale);border-radius:12px;pointer-events:none}.wheel{height:210px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;position:relative;flex:1;text-align:center;padding:84px 0;overscroll-behavior:contain}.wheel::-webkit-scrollbar{display:none}.wheel button{scroll-snap-align:center;display:block;width:100%;height:42px;border:0;background:transparent;font-size:25px;font-weight:550;color:#52646e;line-height:42px;padding:0}.wheel button.chosen{color:var(--blue);font-weight:700}.colon{position:absolute;top:89px;font-size:24px;color:var(--blue);pointer-events:none}.updated{display:none;color:var(--green);font-size:12px;margin-top:12px}.samplebar{font-size:12px;color:var(--muted);margin:19px 0 0}.divide <body>
<main id="main"></main><div class="toast" role="status"></div>
<script>
const paths={calendar:'M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2M7 14h3m4 0h3m-10 4h3',clock:'M12 8v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z',camera:'M8 6l2-3h4l2 3h5v14H3V6Zm9 7a5 5 0 1 1-10 0 5 5 0 0 1 10 0',image:'M3 3h18v18H3Zm0 14 6-6 5 5 3-3 4 4M15 7h1',pen:'m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-5-5L4 14Z',trash:'M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7',chevron:'m9 5 7 7-7 7',back:'m14 5-7 7 7 7',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4',update:'M20 8a9 9 0 1 0 1 7M20 3v5h-5M12 7v6l4 2',plus:'M12 5v14M5 12h14',check:'m5 12 4 4L19 6',arrow:'M5 12h14m-5-5 5 5-5 5',mark:'M18 5h-7C3 5 3 12 10 12h4c7 0 7 7 0 7H5'};
const icon=n=>`<svg aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[n]||paths.calendar}"/></svg>`;
const ib=(n,label,extra='')=>`<button class="iconbutton ${n==='trash'?'delete':''}" aria-label="${label}" ${extra}>${icon(n)}</button>`;
const nav=active=>`<nav class="bottom" aria-label="Navigazione">${[['home','calendar','Home'],['hours','clock','Ore'],['settings','settings','Impostazioni']].map(([id,i,l])=>`<a class="nav ${id===active?'active':''}" href="#${id}"><span>${icon(i)}</span>${l}</a>`).join('')}</nav>`;
const brand=`<div class="brandbar"><span class="brandmark">${icon('mark')}</span>Shiftrail<span class="avatar">MR</span></div>`;
const phone=(id,content,active,overlay='')=>`<div class="phone" id="${id}"><div class="status"><span>9:41</span><span class="system">▴ ▴ ▰</span></div>${brand}<div class="content">${content}</div>${active==='hours'?`<div class="foot"><button class="button" data-demo="Il pannello consente di aggiungere un lavoro extra.">${icon('plus')}Aggiungi lavoro extra</button></div>`:''}${nav(active)}<div class="gesture"></div>${overlay}</div>`;
const smallshift=(day,name,time,type='Turno di lavoro')=>`<div class="shiftrow"><div class="datebox"><span>${name}</span><strong>${day}</strong></div><div><span class="pill">${type}</span><div class="time">${time}</div></div></div>`;
const home=`<h2>Dalla foto<br>al calendario.</h2><p class="sub">I tuoi turni, sempre in ordine.</p><div class="hero"><small>Il prossimo turno</small><div class="shiftart">${icon('calendar')}</div><strong>06:00 – 14:00</strong><div class="row"><span>Domani, giovedì 29 ottobre</span><span>8 ore</span></div></div><button class="button" data-demo="Nell’app apre la fotocamera.">${icon('camera')}Scatta foto</button><button class="button secondary" data-demo="Nell’app apre la galleria.">${icon('image')}Importa foto</button><div class="row sectionrow"><h3>Prossimi turni</h3><span class="sub">Ottobre</span></div>${smallshift('30','ven','14:00 – 22:00')}${smallshift('31','sab','22:00 – 06:00')}<p class="helper">Sabato 31 → domenica 1 novembre</p>`;
function entry(extra=false){return `<div class="card entry"><div class="tools">${ib('pen','Modifica orario','data-open-picker')}${extra?ib('trash','Elimina lavoro extra','data-demo="Prima di eliminare, verrà chiesta conferma."'):''}<span class="pill ${extra?'extra':''}">${extra?'Lavoro extra':'Turno di lavoro'}</span></div><div class="row"><strong>${extra?'Mercoledì 28 ottobre':'Martedì 27 ottobre'}</strong><span>${extra?'2 h 30 min':'8 h'}</span></div><div class="entrytime">${extra?'16:00 – 18:30':'06:00 – 14:00'}</div></div>`}
const hours=`<h2>Ore</h2><div class="month">${ib('back','Mese precedente','data-demo="Seleziona il mese precedente."')}<span>Ottobre 2026</span>${ib('chevron','Mese successivo','data-demo="Seleziona il mese successivo."')}</div><div class="seg"><button class="selected">Mese</button><button data-demo="Qui potrai selezionare la settimana.">Settimana</button></div><div class="card total"><div class="sub">Ore totali</div><div class="big">154 h 30 min</div><div class="totals"><div><span>Turni</span><strong>144 h</strong></div><div><span>Extra</span><strong>10 h 30 min</strong></div><div><span>Di cui notturne</span><strong>24 h</strong></div></div></div><h3>Dettaglio ore</h3>${entry(true)}${entry()}`;
const menus=[['calendar-detail','calendar','Calendario','Destinazione, riposi e colori'],['background-detail','image','Sfondo','Tema e immagine personale'],['notification-detail','bell','Notifiche','Attivazione e anticipo'],['update-detail','update','Aggiornamenti','Versione e accesso alla beta']];
const settings=`<h2>Impostazioni</h2><div class="card profile"><span class="avatar">MR</span><div><strong>Mario Rossi</strong><small>Profilo dei turni</small></div></div><div class="menu">${menus.map(([id,i,t,d])=>`<a class="menuitem" href="#${id}"><span class="ico">${icon(i)}</span><span><b>${t}</b><small>${d}</small></span><span class="arrow">${icon('chevron')}</span></a>`).join('')}</div><div class="versionnote">Shiftrail</div>`;
const backtitle=t=>`<div class="backtitle"><a class="iconbutton" href="#settings" aria-label="Torna alle impostazioni">${icon('back')}</a><h2>${t}</h2></div>`;
const toggle=(label,on=true)=>`<button class="switch right" role="switch" aria-checked="${on}" aria-label="${label}"></button>`;
const setting=(label,value='',right='')=>`<div class="setting"><div><div class="label">${label}</div>${value?`<div class="value">${value}</div>`:''}</div>${right}</div>`;
const calendar=backtitle('Calendario')+`<div class="card settingpanel">${setting('Calendario destinazione','Personale',`<span class="right">${icon('chevron')}</span>`)}${setting('Salva i giorni di riposo','',toggle('Salva i giorni di riposo'))}</div><p class="group-label">Colori degli eventi</p><div class="card settingpanel">${setting('Turni di lavoro','',`<span class="right colorval"><span class="dot"></span>Blu</span>`)}${setting('Turni di riposo','',`<span class="right colorval"><span class="dot" style="background:#386452"></span>Verde</span>`)}</div><button class="button save" data-demo="Mockup: preferenze calendario salvate.">Salva</button>`;
const background=backtitle('Sfondo')+`<h3>Tema dell’app</h3><div class="card"><label style="display:block;padding:8px"><input type="radio" name="theme" checked> Segui il sistema</label><label style="display:block;padding:8px"><input type="radio" name="theme"> Chiaro</label><label style="display:block;padding:8px"><input type="radio" name="theme"> Scuro</label></div><div class="preview"><div class="mini"><b>Shiftrail</b><div class="block"></div><div class="line"></div><div class="line"></div><div class="line"></div></div></div><p class="previewlabel">Sfondo predefinito</p><button class="button save" data-demo="Nell’app apre la scelta della foto.">${icon('image')}Scegli una foto</button><button class="quiet" data-demo="Mockup: sfondo predefinito selezionato.">Ripristina predefinito</button>`;
const notifications=backtitle('Notifiche')+`<div class="card settingpanel">${setting('Attiva notifiche','',toggle('Attiva notifiche'))}</div><h3>Avvisami prima dell’evento</h3><div class="fields"><button class="field" data-demo="Selettore dell’anticipo in ore."><span>Ore</span><b>01</b></button><button class="field" data-demo="Selettore dell’anticipo in minuti."><span>Minuti</span><b>30</b></button></div><button class="button save" data-demo="Mockup: notifiche salvate.">Salva</button>`;
const updates=backtitle('Aggiornamenti')+`<div class="blueicon">${icon('update')}</div><div class="valueblock"><p class="sub">Versione installata</p><strong>1.8.0</strong><div class="helper">Versione dimostrativa</div></div><div class="card settingpanel" style="margin-top:24px">${setting('Partecipa alla beta','',toggle('Partecipa alla beta',false))}</div>`;
const wheel=(type,values,selected)=>`<div class="wheel" tabindex="0" role="listbox" aria-label="${type}" data-initial="${selected}">${values.map(v=>`<button role="option" aria-selected="${v===selected}" class="${v===selected?'chosen':''}" data-value="${v}">${String(v).padStart(2,'0')}</button>`).join('')}</div>`;
const picker=`<div class="sheetback"></div><section class="sheet" aria-label="Modifica orario"><div class="handle"></div><h2>Modifica orario</h2><p class="sub">Lavoro extra · 28 ottobre 2026</p><div class="fields"><button class="field" id="start-field"><span>Inizio</span><b>16:00</b></button><button class="field" id="end-field" style="border-color:var(--line)"><span>Fine</span><b>18:30</b></button></div><div class="wheelhead"><span>Ore</span><span>Minuti</span></div><div class="wheels">${wheel('Ore',Array.from({length:24},(_,i)=>i),16)}<span class="colon">:</span>${wheel('Minuti',[0,15,30,45],0)}</div><button class="button" id="save-time">Salva orario</button><p class="updated" role="status">Orario aggiornato nel mockup.</p></section>`;
function panel(title,body){return `<section><p class="caption">${title}</p>${body}</section>`}
document.querySelector('main').innerHTML=`<section class="board" id="overview"><header class="boardhead"><div><h1>Shiftrail, ogni cosa al suo posto.</h1><p>Home, ore e preferenze con un unico linguaggio visivo.</p></div><span class="tag">Proposta UI · Dati dimostrativi</span></header><div class="grid">${panel('01 / Home',phone('home',home,'home'))}${panel('02 / Ore',phone('hours',hours,'hours'))}${panel('03 / Impostazioni',phone('settings',settings,'settings'))}${panel('04 / Modifica orario',phone('time-picker',hours,'hours',picker))}</div><p class="samplebar">Penna e cestino in alto a sinistra. Ore e minuti scorrono separatamente; minuti a intervalli di 15.</p></section><div class="divider"></div><section class="board" id="details"><header class="boardhead"><div><h1>Quattro menu, impostazioni essenziali.</h1><p>Ogni sezione ha una pagina dedicata. I testi indicati per la rimozione sono esclusi.</p></div><span class="tag">Dettaglio Impostazioni</span></header><div class="grid">${panel('05 / Calendario',phone('calendar-detail',calendar,'settings'))}${panel('06 / Sfondo',phone('background-detail',background,'settings'))}${panel('07 / Notifiche',phone('notification-detail',notifications,'settings'))}${panel('08 / Aggiornamenti',phone('update-detail',updates,'settings'))}</div></section>`;
document.querySelectorAll('[role=switch]').forEach(b=>b.onclick=()=>b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true'));
let toastTimer;function toast(t){const el=document.querySelector('.toast');el.textContent=t;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',3500)}
document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>toast(b.dataset.demo));
document.querySelectorAll('[data-open-picker]').forEach(b=>b.onclick=()=>document.querySelector('#time-picker').scrollIntoView({block:'center'}));
let editing='start';const timeState={start:[16,0],end:[18,30]};const wheels=[...document.querySelectorAll('.wheel')];
function scrollToValue(el,v){const b=el.querySelector(`[data-value="${v}"]`);el.scrollTop=b.offsetTop-84}
function refreshWheel(el){const i=Math.round(el.scrollTop/42);[...el.children].forEach((b,j)=>{b.classList.toggle('chosen',i===j);b.setAttribute('aria-selected',i===j)})}
wheels.forEach(el=>{scrollToValue(el,Number(el.dataset.initial));refreshWheel(el);el.addEventListener('scroll',()=>refreshWheel(el));el.querySelectorAll('button').forEach(b=>b.onclick=()=>scrollToValue(el,Number(b.dataset.value)));el.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();el.scrollTop+=e.key==='ArrowDown'?42:-42}})});
function stash(){timeState[editing]=wheels.map(el=>Number(el.querySelector('.chosen').dataset.value));document.querySelector(`#${editing}-field b`).textContent=timeState[editing].map(v=>String(v).padStart(2,'0')).join(':')}
['start','end'].forEach(id=>document.querySelector(`#${id}-field`).onclick=()=>{stash();editing=id;['start','end'].forEach(key=>document.querySelector(`#${key}-field`).style.borderColor=key===id?'var(--blue)':'var(--line)');wheels.forEach((el,i)=>{scrollToValue(el,timeState[id][i]);refreshWheel(el)})});
document.querySelector('#save-time').onclick=()=>{stash();document.querySelector('.updated').style.display='block';toast('Orario aggiornato solo nel mockup.')};
</script>
</body>
</html>
