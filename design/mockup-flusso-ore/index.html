<script>
'use strict';
const paths={calendar:'M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2M7 14h3m4 0h3m-10 4h3',clock:'M12 8v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z',image:'M3 3h18v18H3Zm0 14 6-6 5 5 3-3 4 4M15 7h1',pen:'m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-5-5L4 14Z',trash:'M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7',chevron:'m9 5 7 7-7 7',back:'m14 5-7 7 7 7',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4',update:'M20 8a9 9 0 1 0 1 7M20 3v5h-5M12 7v6l4 2',plus:'M12 5v14M5 12h14',check:'m5 12 4 4L19 6',close:'m6 6 12 12M6 18 18 6',user:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0M4 21v-3c0-6 16-6 16 0v3',moon:'M21 13A9 9 0 0 1 11 3a9 9 0 1 0 10 10',sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1',cloud:'M6 18a5 5 0 0 1-1-10 7 7 0 0 1 13 0 5 5 0 0 1 0 10Z',phone:'M6 2h12v20H6ZM10 18h4',repeat:'M4 9a8 8 0 0 1 14-4l2 3M20 3v5h-5M20 15A8 8 0 0 1 6 19l-2-3M4 21v-5h5',scan:'M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5M2 12h20'};
const icon=n=>`<svg aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[n]||paths.calendar}"/></svg>`;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initialShifts=()=>[
 {id:'mon',date:'2026-10-26',day:'Lun',start:'06:00',end:'14:00'},
 {id:'tue',date:'2026-10-27',day:'Mar',start:'14:00',end:'22:00'},
 {id:'wed',date:'2026-10-28',day:'Mer',rest:true},
 {id:'thu',date:'2026-10-29',day:'Gio',start:'06:00',end:'14:00',pending:true},
 {id:'fri',date:'2026-10-30',day:'Ven',start:'22:00',end:'06:00'},
 {id:'sat',date:'2026-10-31',day:'Sab',rest:true},
 {id:'sun',date:'2026-11-01',day:'Dom',start:'06:00',end:'14:00'}];
const initialOvertime=()=>[{id:'ot1',date:'2026-10-29',day:'Gio',start:'14:00',end:'16:00',overtime:true}];
const calendars=[
 {id:'work',name:'Turni di lavoro',service:'Google',account:'mario.rossi@example.com',group:'google-main',writable:true},
 {id:'main',name:'Calendario principale',service:'Google',account:'mario.rossi@example.com',group:'google-main',writable:true},
 {id:'family',name:'Famiglia',service:'Google',account:'famiglia@example.com',group:'google-family',writable:true},
 {id:'holidays',name:'Festività in Italia',service:'Google',account:'famiglia@example.com',group:'google-family',writable:false},
 {id:'local',name:'PC Sync',service:'Sul dispositivo',account:null,group:'local',writable:true}];
const model={screen:'analysis',section:null,shifts:initialShifts(),overtime:initialOvertime(),calendar:'work',viewerApp:'Google Calendar',selected:new Set(['mon','tue','thu','fri','sun']),saved:new Set(),added:0,month:10,period:-1,theme:'dark',notifications:true,beta:false,analysing:false,cancelled:false,progress:0};
const ui={modal:null,weekDraft:-1,timeDraft:null,field:'start',returnFocus:null,toast:null};
let analysisTimer=null,saveTimer=null,toastTimer=null;
const steps=[['analysis','Analisi','Leggi il tabellone'],['review','Controllo turni','Conferma gli orari'],['destination','Calendario','Scegli dove salvare'],['confirm','Riepilogo','Controlla gli eventi'],['success','Conclusione','Verifica il risultato']];
const isFlow=()=>steps.some(s=>s[0]===model.screen)||model.screen==='saving';
const working=()=>model.shifts.filter(s=>!s.rest);
const pending=()=>working().filter(s=>s.pending).length;
const chosenCalendar=()=>calendars.find(c=>c.id===model.calendar);
const monthName=()=>model.month===10?'Ottobre 2026':model.month===9?'Settembre 2026':'Novembre 2026';
const dayNumber=d=>Number(d.slice(-2));
const fullDate=s=>new Date(s+'T12:00:00Z').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
const duration=s=>(minutes(s.end)-minutes(s.start)+1440)%1440;
const durationLabel=n=>`${Math.floor(n/60)} h${n%60?' '+String(n%60).padStart(2,'0')+' min':''}`;
const monthEnd=()=>new Date(Date.UTC(2026,model.month,0)).getUTCDate();
function weeks(){const end=monthEnd();let from=1;const result=[];while(from<=end){const weekday=(new Date(Date.UTC(2026,model.month-1,from)).getUTCDay()+6)%7;const until=Math.min(end,from+6-weekday);result.push({from,until,startMonday:from-weekday});from=until+1}return result}
function inPeriod(s,index=model.period){if(Number(s.date.slice(5,7))!==model.month)return false;const w=weeks()[index];return !w||(dayNumber(s.date)>=w.from&&dayNumber(s.date)<=w.until)}
function entries(index=model.period){return [...working(),...model.overtime].filter(s=>inPeriod(s,index)).sort((a,b)=>b.date.localeCompare(a.date)||Number(b.overtime)-Number(a.overtime)||a.start.localeCompare(b.start))}
function totals(index=model.period){let work=0,overtime=0,night=0;for(const s of [...working(),...model.overtime]){const start=Date.parse(s.date+'T00:00:00Z')/60000+minutes(s.start);const end=start+duration(s);for(let t=start;t<end;t++){const d=new Date(t*60000);const day=d.toISOString().slice(0,10);if(!inPeriod({date:day},index))continue;if(s.overtime)overtime++;else work++;if(d.getUTCHours()<6)night++}}return {work,overtime,night,total:work+overtime}}
const ib=(n,label,action,attrs='')=>`<button class="iconbtn ${n==='trash'?'danger':''}" aria-label="${label}" data-action="${action}" ${attrs}>${icon(n)}</button>`;
function destinationCard(){const c=chosenCalendar();return `<div class="selected-destination"><span class="sourceicon">${icon(c.account?'cloud':'phone')}</span><div><div class="destination-name">${c.name}</div><div class="destination-meta">${model.viewerApp||'App da scegliere'}${c.account?' · '+c.account:' · Solo dispositivo'}</div></div></div>`}
const header=(title,sub='')=>`<div class="screenhead"><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>`;
const body=s=>`<div class="body">${s}</div>`;
const footer=(label,action,disabled=false,hint='')=>`<div class="footer">${hint?`<p class="hint">${hint}</p>`:''}<button class="primary" data-action="${action}" ${disabled?'disabled':''}>${label}</button></div>`;
function bottomNav(active){return `<nav class="nav" aria-label="Navigazione principale">${[['flow','calendar','Home'],['hours','clock','Ore'],['settings','settings','Impostazioni']].map(([tab,i,l])=>`<button class="${active===tab?'active':''}" data-tab="${tab}"><span>${icon(i)}</span>${l}</button>`).join('')}</nav>`}
function renderAnalysis(){const percent=model.progress;return header('Analisi immagine')+body(`<div class="analysisart"><p class="fixture-title">26 ottobre – 1 novembre 2026</p><div class="table">${['L','M','M','G','V','S','D','6–14','14–22','X','6–14?','22–6','X','6–14','8–16','X','6–14','X','14–22','6–14','X'].map((s,i)=>`<span class="${i>=7&&i<14?'found':''}">${s}</span>`).join('')}</div>${model.analysing?'<div class="scanline"></div>':''}</div><h3>${model.analysing?'Leggo i tuoi turni':'Tabellone pronto'}</h3><div class="progressbox"><progress aria-label="Analisi del tabellone" max="100" value="${percent}"></progress><div class="row between"><span>${model.analysing?'Analisi in corso':model.cancelled?'Analisi annullata':'Pronta per l’analisi'}</span><span aria-live="off">${percent}%</span></div></div><div class="analysis-stages"><div class="${percent>=25?'complete':''}">${icon(percent>=25?'check':'scan')}Riconoscimento del tabellone</div><div class="${percent>=55?'complete':''}">${icon(percent>=55?'check':'user')}Riga di Mario Rossi</div><div class="${percent>=85?'complete':''}">${icon(percent>=85?'check':'clock')}Date e orari</div></div>`)+footer(model.analysing?'Annulla analisi':model.cancelled?'Riprova':'Avvia analisi',model.analysing?'cancel-analysis':'start-analysis')}
function reviewRow(s){return `<div class="dayrow ${s.rest?'isrest':''}" data-shift="${s.id}"><div class="datebox"><span>${s.day}</span><b>${dayNumber(s.date)}</b></div><div class="grow">${s.rest?'<span class="chip rest">X</span>':`<span class="chip ${s.pending?'pending':''}">${s.pending?'Da controllare':'Confermato'}</span>`}<div class="time">${s.rest?'Riposo':s.start+' – '+s.end}</div>${!s.rest&&s.end<s.start?'<div class="nextday">30 → 31 ottobre</div>':''}</div>${s.rest?'':ib('pen','Modifica orario di '+s.day+' '+dayNumber(s.date),'edit-shift',`data-id="${s.id}"`)}</div>`}
function renderReview(){return header('Controlla i turni','26 ottobre – 1 novembre 2026')+body(`<div class="profile">${icon('user')}Mario Rossi</div>${model.shifts.map(reviewRow).join('')}`)+footer('Conferma turni','to-destination',pending()>0,pending()?`${pending()} orario da confermare`:'')}
function renderCalendars(){const groups=[['google-main','Google','mario.rossi@example.com'],['google-family','Google','famiglia@example.com'],['local','Sul dispositivo',null]];const rows=groups.map(([group,service,account])=>`<div class="provider-head row"><span class="sourceicon">${icon(account?'cloud':'phone')}</span><div><strong>${service}</strong>${account?`<small>${account}</small>`:''}</div></div><div role="radiogroup" aria-label="Calendari ${account||service}">${calendars.filter(c=>c.group===group).map(c=>`<button class="caloption" role="radio" aria-checked="${model.calendar===c.id}" data-action="choose-calendar" data-id="${c.id}" ${c.writable?'':'disabled aria-disabled="true"'}><span class="radio"></span><span class="grow"><b>${c.name}</b>${!c.writable?'<span class="small muted">Solo lettura</span>':!c.account?'<span class="small muted">Nessun account associato</span>':''}</span>${model.calendar===c.id?icon('check'):''}</button>`).join('')}</div>`).join('');return header('Calendario di destinazione')+body(`<div class="card row" style="margin-bottom:22px"><span class="sourceicon">${icon('phone')}</span><div><div class="small muted">App di apertura</div><div class="destination-name" id="viewer-label">${model.viewerApp||'Da scegliere quando apri'}</div></div></div>`+rows)+footer(model.section==='calendar-destination'?'Usa questo calendario':'Continua','calendar-next')}
function renderConfirm(){const selected=working().filter(s=>model.selected.has(s.id));return header('Conferma salvataggio')+body(`<div class="card">${destinationCard()}<button class="change-destination" data-action="change-calendar">Cambia calendario</button></div><h3>Turni da aggiungere</h3>${working().map(s=>`<div class="confirmrow"><label><input type="checkbox" aria-label="Salva il turno di ${s.day} ${dayNumber(s.date)}" data-choose-shift="${s.id}" ${model.selected.has(s.id)?'checked':''}><span><span class="date">${fullDate(s.date)}</span><div class="time">${s.start} – ${s.end}</div></span></label></div>`).join('')}`)+footer(selected.length?`Salva ${selected.length} turni`:'Seleziona un turno','save',selected.length===0)}
function renderSaving(){return header('Salvataggio')+body(`<div style="padding-top:55px"><div class="brandmark" style="width:52px;height:52px;margin-bottom:25px">${icon('calendar')}</div><h3>Aggiungo i turni nel calendario</h3><div class="progressbox"><progress aria-label="Salvataggio dei turni" value="1" max="1"></progress></div></div>`)}
function renderSuccess(){return `<div class="body success" data-result="success"><h2 class="resultlabel">Aggiunti nel calendario</h2><div class="count" id="added-count">${model.added}<span>${model.added===1?'turno':'turni'}</span></div><h3 class="destlabel">Calendario di destinazione</h3><div class="card">${destinationCard()}</div></div>`}
function entryRow(s){return `<div class="card entry" data-entry="${s.id}"><div class="tools"><span class="chip ${s.overtime?'overtime':''}">${s.overtime?'Straordinari':'Turno di lavoro'}</span><div class="buttons">${ib('pen',s.overtime?'Modifica straordinari':'Modifica orario','edit-hours',`data-id="${s.id}"`)}${s.overtime?ib('trash','Elimina straordinari','delete-overtime',`data-id="${s.id}"`):''}</div></div><p class="date">${fullDate(s.date)}</p><p class="entrytime">${s.start} – ${s.end}</p><p class="duration">${durationLabel(duration(s))}</p></div>`}
function renderHours(){const t=totals();const w=weeks()[model.period];return header('Ore')+body(`<div class="monthbar">${ib('back','Mese precedente','previous-month')}<span>${monthName()}</span>${ib('chevron','Mese successivo','next-month')}</div><div class="segment" role="group" aria-label="Periodo delle ore"><button class="${model.period===-1?'active':''}" data-action="month-period" aria-pressed="${model.period===-1}">Mese</button><button class="${model.period>=0?'active':''}" data-action="open-weeks" aria-pressed="${model.period>=0}">Settimana</button></div>${w?`<div class="period-label"><span>${w.from}–${w.until} ${monthName().toLowerCase()}</span><button data-action="open-weeks" aria-label="Cambia settimana">${icon('calendar')}</button></div>`:''}<div class="card total"><div class="total-label">Ore totali</div><div class="big" id="hours-total">${durationLabel(t.total)}</div><div class="breakdown"><div><span>Turni</span><b>${durationLabel(t.work)}</b></div><div><span>Straordinari</span><b>${durationLabel(t.overtime)}</b></div><div><span>Di cui notturne</span><b>${durationLabel(t.night)}</b></div></div></div><h3>Dettaglio ore</h3>${entries().map(entryRow).join('')||'<div class="empty">Nessun turno in questo periodo.</div>'}`)+footer(`${icon('plus')}Aggiungi straordinari`,'add-overtime')+bottomNav('hours')}
function renderSettings(){return header('Impostazioni')+body(`<div class="profilecard"><span class="avatar">MR</span><b>Mario Rossi</b></div><div class="settingsmenu">${[['calendar','calendar','Calendario'],['background','image','Sfondo'],['notifications','bell','Notifiche'],['updates','update','Aggiornamenti']].map(([id,i,title])=>`<button data-action="settings-section" data-id="${id}"><span class="menulead">${icon(i)}</span><b>${title}</b>${icon('chevron')}</button>`).join('')}</div>`)+bottomNav('settings')}
const backHeader=title=>`<div class="screenhead"><div class="backhead">${ib('back','Torna alle impostazioni','settings-root')}<h2>${title}</h2></div></div>`;
function renderSettingsDetail(){const section=model.section;let content='';let title='';if(section==='calendar'){title='Calendario';content=`<button class="card" style="text-align:left;width:100%" data-action="settings-calendar"><div class="row between"><b>Calendario di destinazione</b>${icon('chevron')}</div><div style="margin-top:13px">${destinationCard()}</div></button><div class="card settingrow" style="padding:17px;margin-top:15px"><span>Colore dei turni di lavoro</span><button aria-label="Cambia colore dei turni" data-action="demo-color"><span class="color-dot"></span></button></div>`}else if(section==='background'){title='Sfondo';content=`<h3 style="margin-top:0">Tema dell’app</h3><div class="card" role="radiogroup" aria-label="Tema dell’app">${[['system','Segui il sistema'],['light','Chiaro'],['dark','Scuro']].map(([value,name])=>`<button class="themeoption" role="radio" aria-checked="${model.theme===value}" data-action="set-theme" data-id="${value}"><span class="radio"></span>${name}</button>`).join('')}</div><button class="secondary" style="margin-top:20px" data-action="background-demo">${icon('image')}Scegli un’immagine</button>`}else if(section==='notifications'){title='Notifiche';content=`<div class="card"><div class="settingrow"><span>Attiva notifiche</span><button class="sw" role="switch" aria-label="Attiva notifiche" aria-checked="${model.notifications}" data-action="notifications-toggle"></button></div></div>${model.notifications?'<h3>Avvisami prima dell’evento</h3><div class="row"><label class="grow small">Ore<select class="demo-select" aria-label="Ore di anticipo"><option>01</option><option>00</option><option>02</option></select></label><label class="grow small">Minuti<select class="demo-select" aria-label="Minuti di anticipo"><option>30</option><option>00</option><option>15</option><option>45</option></select></label></div>':''}` }else{title='Aggiornamenti';content=`<div class="card"><p class="small muted">Versione installata</p><h2 style="margin:10px 0 18px">1.0.0</h2><div class="settingrow"><span>Partecipa alla beta</span><button class="sw" role="switch" aria-label="Partecipa alla beta" aria-checked="${model.beta}" data-action="beta-toggle"></button></div></div>`}return backHeader(title)+body(content)+(section==='notifications'?footer('Salva','save-notifications'):'')+bottomNav('settings')}
function renderRail(){const tab=isFlow()?'flow':model.screen==='hours'?'hours':'settings';document.querySelectorAll('[data-tab]').forEach(b=>{if(b.getAttribute('role')==='tab'){b.setAttribute('aria-selected',b.dataset.tab===tab);b.classList.toggle('active',b.dataset.tab===tab)}});let index=steps.findIndex(s=>s[0]===model.screen);if(model.screen==='saving')index=3;document.querySelector('#rail').innerHTML=tab==='flow'?`<p class="kicker">Percorso di importazione</p><ol class="steps">${steps.map(([id,title,sub],i)=>`<li><button class="step ${index===i?'active':''} ${index>i?'done':''}" data-jump="${id}" ${i>index?'disabled':''}><span class="num">${index>i?icon('check'):i+1}</span><span><strong>${title}</strong><small>${sub}</small></span></button></li>`).join('')}</ol>`:tab==='hours'?`<p class="kicker">Prova i controlli</p><button class="side-action" data-action="open-weeks">${icon('calendar')}<span>Scegli una settimana</span>${icon('chevron')}</button><button class="side-action" data-action="show-overtime">${icon('pen')}<span>Modifica gli straordinari</span>${icon('chevron')}</button><div class="context"><h3>Azioni in alto a destra</h3><p>Ogni turno ha la penna. Gli straordinari hanno anche il cestino, con conferma prima dell’eliminazione.</p></div>`:`<p class="kicker">Menu essenziali</p><div class="context" style="margin-top:0"><p>Quattro voci, senza sottotesti. Il tema chiaro e scuro si possono provare da Sfondo.</p></div>`;document.querySelector('[data-action=reset]').innerHTML=icon('repeat')+'Ricomincia la demo';document.querySelector('[data-action=repeat]').innerHTML=icon('calendar')+'Ripeti la stessa importazione';document.querySelector('#saved-counter').textContent=`Eventi simulati salvati: ${model.saved.size}`;renderContext()}
function renderContext(){let content='';if(isFlow()){content=`<p class="kicker">Cosa cambia nel percorso</p><h3>Destinazione riconoscibile</h3><p>Servizio e account raggruppano i calendari. L’indirizzo non viene ripetuto nel nome del calendario principale.</p><div class="context"><h3>Solo turni di lavoro</h3><p>Le due X non diventano eventi. Il riepilogo mostra soltanto i turni selezionati.</p></div><div class="context"><h3>Conclusione essenziale</h3><p>Il risultato contiene soltanto “Aggiunti nel calendario” e “Calendario di destinazione”.</p></div><label class="demo-label" for="scenario">Scenario da provare</label><select class="demo-select" id="scenario"><option value="new" ${model.saved.size===0?'selected':''}>Prima importazione</option><option value="existing" ${model.saved.size>0?'selected':''}>Turni già presenti</option></select><label class="demo-label" for="viewer-app">Simula l’app predefinita</label><select class="demo-select" id="viewer-app"><option value="Google Calendar" ${model.viewerApp==='Google Calendar'?'selected':''}>Google Calendar</option><option value="Calendario Huawei" ${model.viewerApp==='Calendario Huawei'?'selected':''}>Calendario Huawei</option><option value="" ${!model.viewerApp?'selected':''}>Nessuna predefinita</option></select>`}else if(model.screen==='hours'){content=`<p class="kicker">Selezione del periodo</p><h3>Le date prima dei numeri</h3><p>Il pannello mostra gli intervalli, i giorni e un’anteprima delle ore. “Mostra settimana” applica la scelta; chiudere il pannello la annulla.</p><div class="context"><h3>Settimane a cavallo del mese</h3><p>Il 1° novembre appare attenuato nell’ultima riga di ottobre. Il totale di ottobre conta soltanto i giorni di ottobre.</p></div>`}else{content=`<p class="kicker">Impostazioni</p><h3>Una riga per menu</h3><p>Calendario, Sfondo, Notifiche e Aggiornamenti hanno soltanto titolo e icona.</p><div class="context"><h3>Riposi esclusi</h3><p>Il menu Calendario non offre più salvataggio o colore dei riposi, perché non devono essere aggiunti.</p></div>`}document.querySelector('#context').innerHTML=content}
function render(){const renderers={analysis:renderAnalysis,review:renderReview,destination:renderCalendars,confirm:renderConfirm,saving:renderSaving,success:renderSuccess,hours:renderHours,settings:renderSettings,'settings-detail':renderSettingsDetail};document.querySelector('#screen').innerHTML=renderers[model.screen]();renderRail();updateThemeButton()}
function stopTimers(){clearInterval(analysisTimer);clearTimeout(saveTimer);model.analysing=false}
function setScreen(screen){if(model.screen==='analysis'&&screen!=='analysis')clearInterval(analysisTimer);closeModal(false);model.screen=screen;render()}
function startAnalysis(){stopTimers();model.screen='analysis';model.section=null;model.analysing=true;model.cancelled=false;model.progress=0;render();analysisTimer=setInterval(()=>{model.progress=Math.min(100,model.progress+10);if(model.progress>=100){clearInterval(analysisTimer);model.analysing=false;setScreen('review')}else render()},200)}
function reset(keepSaved=false){const saved=keepSaved?model.saved:new Set();stopTimers();Object.assign(model,{shifts:initialShifts(),overtime:initialOvertime(),saved,selected:new Set(['mon','tue','thu','fri','sun']),added:0,period:-1,month:10,section:null});startAnalysis()}
function setTheme(theme){model.theme=theme;const dark=theme==='dark'||(theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';render()}
function updateThemeButton(){const dark=document.documentElement.dataset.theme==='dark';const b=document.querySelector('#theme-toggle');b.innerHTML=icon(dark?'sun':'moon')+(dark?'Tema chiaro':'Tema scuro');b.setAttribute('aria-label',dark?'Passa al tema chiaro':'Passa al tema scuro')}
function announce(message){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.querySelector('#phone').append(el);toastTimer=setTimeout(()=>el.remove(),3000)}
function closeModal(restore=true){ui.modal=null;document.querySelector('#modal-root').innerHTML='';document.querySelector('#screen').inert=false;document.querySelector('.appbar').inert=false;if(restore&&ui.returnFocus?.isConnected)ui.returnFocus.focus();ui.returnFocus=null}
function showModal(title,content,foot){if(!ui.returnFocus)ui.returnFocus=document.activeElement;document.querySelector('#screen').inert=true;document.querySelector('.appbar').inert=true;document.querySelector('#modal-root').innerHTML=`<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}" tabindex="-1"><div class="sheethead"><div class="handle"></div><div class="row between"><h2>${title}</h2>${ib('close','Chiudi pannello','close-modal')}</div></div><div class="sheetbody">${content}</div><div class="sheetfoot">${foot}</div></section></div>`;document.querySelector('.sheet').focus({preventScroll:true})}
function openWeeks(){ui.modal='weeks';ui.weekDraft=model.period;renderWeeks(true)}
function renderWeeks(initial=false){const month=monthName().split(' ')[0].toLowerCase();const options=weeks().map((w,i)=>`<button class="weekoption" role="radio" aria-checked="${ui.weekDraft===i}" data-action="week-draft" data-index="${i}"><div class="weektitle"><span>${w.from}–${w.until} ${month}</span>${model.month===10&&i===4?'<span class="chip">Questa settimana</span>':''}</div><div class="weekdays">${Array.from({length:7},(_,j)=>{const day=w.startMonday+j;const real=new Date(Date.UTC(2026,model.month-1,day));const n=real.getUTCDate();const date=real.toISOString().slice(0,10);return `<span class="${day<w.from||day>w.until?'out':''} ${date==='2026-10-28'?'today':''} ${working().some(s=>s.date===date)?'workday':''}">${n}</span>`}).join('')}</div></button>`).join('');const t=totals(ui.weekDraft);const content=`<div class="row between"><h3>${monthName()}</h3></div><button class="weekoption full" role="radio" aria-checked="${ui.weekDraft===-1}" data-action="week-draft" data-index="-1"><span>Tutto il mese</span><span class="radio"></span></button><div class="weekdayheader">${['L','M','M','G','V','S','D'].map(d=>`<span>${d}</span>`).join('')}</div><div role="radiogroup" aria-label="Settimane del mese">${options}</div><div class="weekpreview" aria-live="polite">${durationLabel(t.total)} nel periodo selezionato</div>`;showModal('Scegli il periodo',content,`<button class="primary" data-action="apply-week">${ui.weekDraft===-1?'Mostra mese':'Mostra settimana'}</button>`);ui.modal='weeks'}
function timeOptions(type,values,value){return `<div class="wheel" role="listbox" aria-label="${type}" tabindex="0" data-wheel="${type}" data-value="${value}">${values.map(v=>`<button role="option" tabindex="-1" aria-selected="${v===value}" data-time-value="${v}">${String(v).padStart(2,'0')}</button>`).join('')}</div>`}
function openTime(id,source,adding=false){const entry=source==='review'?model.shifts.find(s=>s.id===id):[...working(),...model.overtime].find(s=>s.id===id);ui.timeDraft={...(entry||{id:'ot'+Date.now(),date:'2026-10-29',day:'Gio',start:'14:00',end:'16:00',overtime:true}),source,adding};ui.field='start';renderTime()}
function renderTime(){const d=ui.timeDraft;const label=d.source==='review'?'Conferma orario':d.overtime?(d.adding?'Aggiungi straordinari':'Modifica straordinari'):'Modifica orario';const [h,m]=d[ui.field].split(':').map(Number);showModal(label,`<p class="small muted" style="margin-bottom:15px">${fullDate(d.date)}</p><div class="timefields">${['start','end'].map(f=>`<button class="timefield ${ui.field===f?'active':''}" data-action="time-field" data-id="${f}"><span>${f==='start'?'Inizio':'Fine'}</span><b>${d[f]}</b></button>`).join('')}</div><div class="wheel-labels"><span>Ore</span><span>Minuti</span></div><div class="wheels">${timeOptions('Ore',Array.from({length:24},(_,i)=>i),h)}<span class="colon">:</span>${timeOptions('Minuti',[0,15,30,45],m)}</div><p class="error" id="time-error" ${d.start===d.end?'':'hidden'}>Inizio e fine devono essere diversi.</p>`,`<button class="primary" data-action="save-time" ${d.start===d.end?'disabled':''}>${d.source==='review'?'Conferma orario':'Salva orario'}</button>`);ui.modal='time';document.querySelectorAll('.wheel').forEach(w=>{w.scrollTop=Number(w.dataset.value)/(w.dataset.wheel==='Minuti'?15:1)*42;w.addEventListener('scroll',()=>wheelChanged(w));w.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();w.scrollTop+=(e.key==='ArrowDown'?42:-42)}})})}
function wheelChanged(w){const options=[...w.children];const index=Math.max(0,Math.min(options.length-1,Math.round(w.scrollTop/42)));options.forEach((b,i)=>b.setAttribute('aria-selected',index===i));w.dataset.value=options[index].dataset.timeValue;const wheels=[...document.querySelectorAll('.wheel')];if(wheels.length!==2)return;ui.timeDraft[ui.field]=wheels.map(el=>String(Number(el.dataset.value)).padStart(2,'0')).join(':');document.querySelector(`.timefield[data-id="${ui.field}"] b`).textContent=ui.timeDraft[ui.field];const invalid=ui.timeDraft.start===ui.timeDraft.end;document.querySelector('[data-action=save-time]').disabled=invalid;document.querySelector('#time-error').hidden=!invalid}
function saveTime(){const d=ui.timeDraft;if(d.start===d.end)return;const source=d.source==='review'?model.shifts:d.overtime?model.overtime:model.shifts;const target=source.find(s=>s.id===d.id);if(target)Object.assign(target,{start:d.start,end:d.end,pending:false});else if(d.adding)model.overtime.push({id:d.id,date:d.date,day:d.day,start:d.start,end:d.end,overtime:true});closeModal();render()}
function openDelete(id){const s=model.overtime.find(s=>s.id===id);if(!s)return;ui.modal='delete';showModal('Eliminare gli straordinari?',`<p class="dialog-copy">${fullDate(s.date)}<br>${s.start} – ${s.end}</p>`,`<button class="secondary" data-action="close-modal">Annulla</button><button class="primary" style="background:var(--red);color:var(--bg)" data-action="confirm-delete" data-id="${id}">Elimina straordinari</button>`);ui.modal='delete'}
function saveEvents(){if(!model.selected.size||pending())return;setScreen('saving');saveTimer=setTimeout(()=>{model.added=0;for(const s of working().filter(s=>model.selected.has(s.id))){const key=model.calendar+':'+s.date;if(!model.saved.has(key)){model.saved.add(key);model.added++}}setScreen('success')},750)}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){if(ui.modal)closeModal();stopTimers();if(tab.dataset.tab==='flow'){setScreen(model.progress<100?'analysis':'review')}else{model.section=null;setScreen(tab.dataset.tab)}return}const jump=e.target.closest('[data-jump]');if(jump&&!jump.disabled){setScreen(jump.dataset.jump);return}const timeValue=e.target.closest('[data-time-value]');if(timeValue){const w=timeValue.closest('.wheel');w.scrollTop=[...w.children].indexOf(timeValue)*42;wheelChanged(w);return}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const id=b.dataset.id;switch(b.dataset.action){case'reset':reset(false);break;case'repeat':reset(true);break;case'cancel-analysis':stopTimers();model.cancelled=true;model.progress=0;render();break;case'start-analysis':startAnalysis();break;case'edit-shift':openTime(id,'review');break;case'to-destination':if(!pending()){model.section=null;setScreen('destination')}break;case'choose-calendar':if(calendars.find(c=>c.id===id)?.writable){model.calendar=id;render()}break;case'calendar-next':if(model.section==='calendar-destination'){model.section='calendar';setScreen('settings-detail')}else setScreen('confirm');break;case'change-calendar':setScreen('destination');break;case'save':saveEvents();break;case'previous-month':model.month=model.month===9?11:model.month-1;model.period=-1;render();break;case'next-month':model.month=model.month===11?9:model.month+1;model.period=-1;render();break;case'month-period':model.period=-1;render();break;case'open-weeks':if(model.screen!=='hours')setScreen('hours');openWeeks();break;case'week-draft':ui.weekDraft=Number(b.dataset.index);renderWeeks();document.querySelector(`[data-action=week-draft][data-index="${ui.weekDraft}"]`).focus();break;case'apply-week':model.period=ui.weekDraft;closeModal();render();break;case'close-modal':closeModal();break;case'edit-hours':openTime(id,'hours');break;case'add-overtime':openTime(null,'hours',true);break;case'delete-overtime':openDelete(id);break;case'confirm-delete':model.overtime=model.overtime.filter(s=>s.id!==id);closeModal();render();announce('Straordinari eliminati nel prototipo.');break;case'time-field':ui.field=id;renderTime();break;case'save-time':saveTime();break;case'show-overtime':if(model.screen!=='hours')setScreen('hours');if(model.overtime.length)openTime(model.overtime[0].id,'hours');else announce('Non ci sono straordinari.');break;case'settings-section':model.section=id;setScreen('settings-detail');break;case'settings-root':model.section=null;setScreen('settings');break;case'settings-calendar':model.section='calendar-destination';setScreen('destination');break;case'set-theme':setTheme(id);break;case'notifications-toggle':model.notifications=!model.notifications;render();break;case'beta-toggle':model.beta=!model.beta;render();break;case'save-notifications':announce('Preferenza aggiornata soltanto nel prototipo.');break;case'background-demo':announce('La scelta della foto resta disponibile nell’app.');break;case'demo-color':announce('Qui si aprirà la scelta del colore dei turni.');break}});
document.addEventListener('change',e=>{if(e.target.id==='viewer-app'){model.viewerApp=e.target.value;render();return}if(e.target.matches('[data-choose-shift]')){const id=e.target.dataset.chooseShift;if(e.target.checked)model.selected.add(id);else model.selected.delete(id);render()}if(e.target.id==='scenario'){model.saved.clear();if(e.target.value==='existing')working().forEach(s=>model.saved.add(model.calendar+':'+s.date));renderRail()}});
document.addEventListener('keydown',e=>{if(!ui.modal)return;if(e.key==='Escape'){e.preventDefault();closeModal();return}if(e.key==='Tab'){const focusable=[...document.querySelectorAll('.sheet button:not(:disabled):not([tabindex="-1"]),.sheet [tabindex="0"]')].filter(el=>el.getClientRects().length);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement.classList.contains('sheet'))){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
document.querySelector('#modal-root').addEventListener('click',e=>{if(e.target.classList.contains('overlay'))closeModal()});
document.querySelector('#theme-toggle').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(model.theme==='system')setTheme('system')});
render();
</script>
</body>
